name: Sitemap watcher

on:
  schedule:
    # Odd minutes avoid the busiest moments at the top of the hour
    - cron: "7,37 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write   # commit state and RSS files
  pages: write      # publish RSS with GitHub Pages
  id-token: write

concurrency:
  group: sitemap-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check sitemaps
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node check.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "sitemap-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update sitemap state"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only republish the RSS files when something actually changed
      - name: Upload site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
